[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "profile-service"
version = "0.1.0"
description = "Candidate profile intelligence backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.30",
  "greenlet>=3.0.0",
  "asyncpg>=0.29.0",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.13.1",
  "httpx>=0.27.0",
  "pydantic-settings>=2.3.4",
  "structlog>=24.2.0",
  "google-genai>=1.20.0",
  "pymupdf>=1.24.0",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0.1",
  "rapidfuzz>=3.9.0",
  "email-validator>=2.2.0",
  "bcrypt>=4.2.0",
  "resend>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.7",
  "anyio>=4.4.0",
  "ruff>=0.5.0",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
