[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-ingestion"
version = "0.1.0"
description = "Greenhouse job ingestion backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.30",
  "greenlet>=3.0.0",
  "asyncpg>=0.29.0",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.13.1",
  "apscheduler>=3.10.4",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.3",
  "pydantic-settings>=2.3.4",
  "structlog>=24.2.0",
  "instructor>=1.3.3",
  "google-genai>=1.20.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.7",
  "anyio>=4.4.0",
  "ruff>=0.5.0",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
